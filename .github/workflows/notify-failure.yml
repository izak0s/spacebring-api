name: Notify on failure

# Telegram alert when an automation workflow fails on main — with auto-merge
# active, a silent red pipeline is the failure mode to guard against.
on:
  workflow_run:
    workflows: [CI, Spec sync, Publish, Auto release, Docs]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    # Auto release runs on `pull_request`, so its head_branch is the bot
    # branch, never main - without the second clause its failures were silent.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.name == 'Auto release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 — local composite action needs the repo
      - uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ❌ ${{ github.event.workflow_run.name }} failed on main
            ${{ github.event.workflow_run.html_url }}
